# Opens the dashboard on a schedule so the free Streamlit server never falls asleep, and so the
# morning update (prices, overnight US data, forecast) has already run before you open it.
# Free on public repositories. Change APP_URL if your app has a different address.
name: Keep dashboard awake

on:
  schedule:
    # GitHub uses UTC and can start a few minutes late. IST = UTC + 5:30.
    - cron: "20 3 * * 1-5"    # 08:50 IST: triggers the pre-market update
    - cron: "35 3 * * 1-5"    # 09:05 IST: checks it finished before the 09:15 open
    - cron: "25 10 * * 1-5"   # 15:55 IST
    - cron: "50 10 * * 1-5"   # 16:20 IST: picks up today's NSE close
    - cron: "0 */4 * * *"     # every 4 hours, every day: never idle long enough to sleep
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

env:
  APP_URL: https://pulse8.streamlit.app

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Open the app (and wake it if asleep)
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=120_000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep: waking it")
                  wake.click()
              # Wait for the dashboard to draw (first start after a restart can take minutes).
              page.wait_for_timeout(5_000)
              frame = page.frame_locator("iframe").first if page.locator("iframe").count() else page
              try:
                  frame.get_by_text("Pulse8", exact=True).first.wait_for(timeout=600_000)
                  print("Dashboard is up")
              except Exception as exc:
                  print(f"Dashboard did not finish drawing: {exc}")
              page.wait_for_timeout(60_000)  # stay connected while a background update runs
