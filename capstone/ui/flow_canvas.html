<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --text:#1f1e1b; --muted:#6b6a65; --card:#ffffff; --line:rgba(128,128,128,0.25); }
  :root[data-theme="dark"] { --text:#ecebe6; --muted:#a3a29c; --card:#1c1c1f; --line:rgba(200,200,200,0.2); }
  html, body { margin:0; padding:0; background:transparent; color:var(--text);
    font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; font-size:12.5px; color:var(--muted);
    padding:2px 4px 8px; }
  .bar b { color:var(--text); font-weight:600; }
  .key { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .tag { background:rgba(237,161,0,0.16); color:#9a6a00; border-radius:999px; padding:2px 10px; font-weight:600; }
  :root[data-theme="dark"] .tag { color:#f2c14e; }
  .spacer { flex:1; }
  button { font:inherit; font-size:12.5px; color:var(--text); background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:4px 12px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  #wrap { position:relative; }
  canvas { display:block; width:100%; }
  #tip { position:absolute; pointer-events:none; background:var(--card); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; font-size:12.5px; line-height:1.45; box-shadow:0 4px 16px rgba(0,0,0,0.12);
    display:none; white-space:nowrap; z-index:2; }
  #note { font-size:12.5px; color:var(--muted); padding:6px 4px 0; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
<div id="note"></div>
<script>
const DATA = __DATA__;
document.documentElement.dataset.theme = DATA.dark ? "dark" : "light";
const css = getComputedStyle(document.documentElement);
const TEXT = css.getPropertyValue("--text").trim(), MUTED = css.getPropertyValue("--muted").trim();
const HALO = DATA.dark ? "rgba(14,17,23,0.85)" : "rgba(255,255,255,0.88)";

// ---------- header: legend + pause ----------
const bar = document.getElementById("bar");
bar.innerHTML = DATA.legend.map(k => k.color
  ? `<span class="key"><span class="dot" style="background:${k.color}"></span>${k.text}</span>`
  : `<span class="key">${k.text}</span>`).join("")
  + (DATA.estimate ? `<span class="tag">Estimate</span>` : "")
  + `<span class="spacer"></span><button id="pause"></button>`;
document.getElementById("note").textContent = DATA.note || "";
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let paused = reduce;
const pauseBtn = document.getElementById("pause");
const setBtn = () => pauseBtn.textContent = paused ? "▶ Play motion" : "❚❚ Pause motion";
setBtn();
pauseBtn.onclick = () => { paused = !paused; setBtn(); if (!paused) last = performance.now(); };

// ---------- layout ----------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), tip = document.getElementById("tip");
const NODE_W = 10, GAP = DATA.gap || 10;
let W = 0, H = DATA.height, nodes = [], links = [], particles = [];

function layout() {
  W = cv.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = Math.max(...DATA.nodes.map(n => n.col)) + 1;
  const padL = Math.min(DATA.padLeft || 170, W * 0.3), padR = Math.min(DATA.padRight || 190, W * 0.32), padT = 14, padB = 14;
  nodes = DATA.nodes.map((n, i) => ({ ...n, i, inV: 0, outV: 0, ins: [], outs: [] }));
  links = DATA.links.map((l, i) => ({ ...l, i, s: nodes[l.source], t: nodes[l.target] }));
  links.forEach(l => { l.s.outV += l.value; l.t.inV += l.value; l.s.outs.push(l); l.t.ins.push(l); });
  nodes.forEach(n => n.v = Math.max(n.inV, n.outV));
  // Leaf nodes get a minimum height so every stock keeps a readable label; bands stay to scale.
  const MIN_LEAF = DATA.minLeaf || 14;
  nodes.forEach(n => n.minH = n.big ? 1.5 : n.col === cols - 1 ? MIN_LEAF : 12);
  let k = Infinity;
  for (let pass = 0; pass < 3; pass++) {
    let kk = Infinity;
    for (let c = 0; c < cols; c++) {
      const col = nodes.filter(n => n.col === c);
      const room = H - padT - padB - GAP * (col.length - 1);
      const fixed = col.filter(n => k !== Infinity && n.v * k < n.minH);
      const free = col.filter(n => !fixed.includes(n)).reduce((a, n) => a + n.v, 0);
      const used = fixed.reduce((a, n) => a + n.minH, 0);
      if (free > 0) kk = Math.min(kk, (room - used) / free);
    }
    k = kk;
  }
  for (let c = 0; c < cols; c++) {
    const col = nodes.filter(n => n.col === c);
    col.forEach(n => n.h = Math.max(n.v * k, n.minH));
    const total = col.reduce((a, n) => a + n.h, 0) + GAP * (col.length - 1);
    let y = padT + (H - padT - padB - total) / 2;
    const x = cols === 1 ? padL : padL + c * (W - padL - padR - NODE_W) / (cols - 1);
    col.forEach(n => { n.x = x; n.y = y; y += n.h + GAP; });
  }
  links.forEach(l => l.w = Math.max(l.value * k, 1));
  nodes.forEach(n => {
    n.outs.sort((a, b) => a.t.y - b.t.y); n.ins.sort((a, b) => a.s.y - b.s.y);
    let y = n.y + (n.h - n.outV * k) / 2;
    n.outs.forEach(l => { l.y0 = y + l.w / 2; y += l.value * k; });
    y = n.y + (n.h - n.inV * k) / 2; n.ins.forEach(l => { l.y1 = y + l.w / 2; y += l.value * k; });
  });
  links.forEach(l => { l.x0 = l.s.x + NODE_W; l.x1 = l.t.x; l.xm = (l.x0 + l.x1) / 2; });
  makeParticles();
}

// ---------- particles: more dots = more money, faster = stronger move ----------
function makeParticles() {
  const total = links.reduce((a, l) => a + l.value, 0) || 1;
  const budget = Math.min(DATA.maxParticles || 650, 650);
  particles = [];
  links.forEach(l => {
    const n = Math.max(2, Math.min(60, Math.round(budget * l.value / total)));
    for (let j = 0; j < n; j++) particles.push({ l, t: Math.random(), off: (Math.random() - 0.5) * 0.8,
      r: 1.3 + Math.random() * 1.4, jit: 0.75 + Math.random() * 0.5 });
  });
}

function bez(l, t) {  // point on the link's centre line (cubic bezier with horizontal tangents)
  const u = 1 - t;
  const x = u*u*u*l.x0 + 3*u*u*t*l.xm + 3*u*t*t*l.xm + t*t*t*l.x1;
  const y = u*u*u*l.y0 + 3*u*u*t*l.y0 + 3*u*t*t*l.y1 + t*t*t*l.y1;
  return [x, y];
}

function ribbon(l) {
  const h = l.w / 2;
  ctx.beginPath();
  ctx.moveTo(l.x0, l.y0 - h);
  ctx.bezierCurveTo(l.xm, l.y0 - h, l.xm, l.y1 - h, l.x1, l.y1 - h);
  ctx.lineTo(l.x1, l.y1 + h);
  ctx.bezierCurveTo(l.xm, l.y1 + h, l.xm, l.y0 + h, l.x0, l.y0 + h);
  ctx.closePath();
}

let hover = null, last = performance.now(), clock = 0;

function draw(now) {
  const dt = paused ? 0 : Math.min((now - last) / 1000, 0.05);
  last = now; clock += dt;
  ctx.clearRect(0, 0, W, H);
  // ribbons
  links.forEach(l => {
    const g = ctx.createLinearGradient(l.x0, 0, l.x1, 0);
    const a = hover ? (hover.link === l || hover.node === l.s || hover.node === l.t ? 1 : 0.35) : 1;
    g.addColorStop(0, rgba(l.colorFrom || l.color, 0.20 * a));
    g.addColorStop(1, rgba(l.color, 0.28 * a));
    ribbon(l); ctx.fillStyle = g; ctx.fill();
  });
  // surge glow: links whose stock traded far above its usual pace in the last minute
  links.forEach(l => {
    if (!l.surge) return;
    const pulse = 0.35 + 0.35 * Math.sin(clock * 3 + l.i);
    ribbon(l); ctx.save(); ctx.shadowColor = rgba("#eda100", 0.9); ctx.shadowBlur = 10;
    ctx.strokeStyle = rgba("#eda100", pulse); ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  });
  // particles
  particles.forEach(p => {
    const l = p.l;
    p.t += dt * (DATA.baseSpeed || 0.12) * (0.45 + 1.6 * (l.speed || 0)) * p.jit;
    if (p.t > 1) p.t -= 1;
    const [x, y] = bez(l, p.t);
    const fade = Math.min(1, p.t * 6, (1 - p.t) * 6);
    const dim = hover && !(hover.link === l || hover.node === l.s || hover.node === l.t) ? 0.25 : 1;
    ctx.beginPath(); ctx.arc(x, y + p.off * l.w * 0.5, p.r, 0, 6.283);
    ctx.fillStyle = rgba(l.dot || l.color, 0.85 * fade * dim); ctx.fill();
  });
  // nodes + labels
  nodes.forEach(n => {
    ctx.fillStyle = n.color; roundRect(n.x, n.y, NODE_W, n.h, 3); ctx.fill();
    if (n.surge) { ctx.save(); ctx.shadowColor = "#eda100"; ctx.shadowBlur = 8 + 6 * Math.sin(clock * 3);
      ctx.fillStyle = rgba("#eda100", 0.9); ctx.beginPath(); ctx.arc(labelEnd(n) + 7, n.y + n.h / 2, 3, 0, 6.283);
      ctx.fill(); ctx.restore(); }
    label(n);
  });
  requestAnimationFrame(draw);
}

function labelPos(n) {
  const right = n.align ? n.align === "right" : n.col !== 0;
  return { x: right ? n.x + NODE_W + 6 : n.x - 6, align: right ? "left" : "right" };
}
function labelEnd(n) {
  ctx.font = `600 12.5px Inter, "Segoe UI", sans-serif`;
  const p = labelPos(n);
  return p.align === "left" ? p.x + Math.max(ctx.measureText(n.label).width,
    n.sub ? (ctx.font = "12px Inter, sans-serif", ctx.measureText(n.sub).width) : 0) : p.x;
}
function label(n) {
  if (n.h < 3 && !n.big) return;
  const p = labelPos(n), cy = n.y + n.h / 2;
  const two = n.sub && n.h >= 26, one = n.sub && !two;
  ctx.textAlign = p.align; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.font = `${n.big ? 700 : 600} ${n.big ? 15 : 12.5}px Inter, "Segoe UI", sans-serif`;
  const main = one ? `${n.label}  ${n.sub}` : n.label;
  const y1 = two ? cy - 7 : cy;
  ctx.strokeStyle = HALO; ctx.lineWidth = 3; ctx.strokeText(main, p.x, y1);
  ctx.fillStyle = TEXT; ctx.fillText(main, p.x, y1);
  if (two) { ctx.font = "12px Inter, sans-serif"; ctx.strokeText(n.sub, p.x, cy + 8);
    ctx.fillStyle = n.subColor || MUTED; ctx.fillText(n.sub, p.x, cy + 8); }
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rgba(hex, a) {
  if (hex.startsWith("rgba")) return hex;
  const c = hex.replace("#", ""); const v = parseInt(c, 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
}

// ---------- hover ----------
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let found = null;
  for (const n of nodes) if (mx >= n.x - 4 && mx <= n.x + NODE_W + 4 && my >= n.y - 2 && my <= n.y + n.h + 2) found = { node: n };
  if (!found) for (const l of links) {
    if (mx < l.x0 || mx > l.x1) continue;
    let t = (mx - l.x0) / (l.x1 - l.x0);
    for (let i = 0; i < 4; i++) { const [bx] = bez(l, t); t = Math.min(1, Math.max(0, t + (mx - bx) / (l.x1 - l.x0))); }
    const [, by] = bez(l, t);
    if (Math.abs(my - by) <= Math.max(l.w / 2, 3)) { if (!found || l.w < found.link.w) found = { link: l }; }
  }
  hover = found;
  if (!found) { tip.style.display = "none"; return; }
  tip.innerHTML = found.node ? found.node.tip : found.link.tip;
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(mx + 14, W - tw - 4) + "px"; tip.style.top = (my + 14) + "px";
});
cv.addEventListener("mouseleave", () => { hover = null; tip.style.display = "none"; });

new ResizeObserver(() => { if (cv.parentElement.clientWidth !== W) layout(); }).observe(cv.parentElement);
layout();
requestAnimationFrame(draw);
</script>
</body>
</html>
